steps:
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Installing system prerequisites: curl, unzip, git, ffmpeg, python3 ==="
        apt-get update && apt-get install -y --no-install-recommends \
          curl \
          unzip \
          git \
          ffmpeg \
          python3

        if [ -f "eval/fetch_eval_data.py" ]; then
          python3 eval/fetch_eval_data.py
        elif [ -f "fetch_eval_data.py" ]; then
          python3 fetch_eval_data.py
        else
          echo "fetch_eval_data.py not found!"
          exit 1
        fi
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: '3600s'
